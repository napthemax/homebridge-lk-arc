name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify the tag matches package.json
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Refusing to publish from ${GITHUB_REF}. Run this workflow on a vX.Y.Z tag."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi
      - run: npm publish
